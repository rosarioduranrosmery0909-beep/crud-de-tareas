<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CRUD de Tareas</title>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
    <h2>Login</h2>
    <input type="email" id="email" placeholder="Correo"><br><br>
    <input type="password" id="password" placeholder="Contraseña"><br><br>
    <button onclick="login()">Entrar</button>
    <button onclick="registro()">Registrarme</button>
    <p id="mensaje"></p>
</div>

<!-- ================= CRUD ================= -->
<div id="crud" style="display:none;">
    <h2>CRUD de Tareas</h2>

    <input type="text" id="titulo" placeholder="Título tarea">
    <select id="estado">
        <option>Pendiente</option>
        <option>Completada</option>
    </select>
    <button onclick="crearTarea()">Agregar</button>

    <ul id="lista"></ul>
</div>

<script>
// ================= LOGIN =================
function login() {
    fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.mensaje){
            document.getElementById('login').style.display = 'none';
            document.getElementById('crud').style.display = 'block';
            cargarTareas();
        }else{
            mensaje.innerText = data.error;
        }
    });
}

function registro() {
    fetch('/registro', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => mensaje.innerText = data.mensaje || data.error);
}

// ================= CRUD =================
function cargarTareas(){
    fetch('/tareas')
    .then(res => res.json())
    .then(tareas => {
        lista.innerHTML = '';
        tareas.forEach(t => {
            lista.innerHTML += `
            <li>
                ${t.titulo} - ${t.estado}
                <button onclick="eliminar(${t.id})">X</button>
            </li>`;
        });
    });
}

function crearTarea(){
    fetch('/tareas', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            titulo: titulo.value,
            estado: estado.value
        })
    }).then(() => cargarTareas());
}

function eliminar(id){
    fetch('/tareas/'+id, {method:'DELETE'})
    .then(() => cargarTareas());
}
</script>

</body>
</html>
