<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Login y CRUD</title>

<style>
body{
    font-family: Arial;
    background:#d8ecff;
    text-align:center;
}

.caja{
    background:white;
    width:320px;
    margin:60px auto;
    padding:20px;
    border-radius:10px;
    border:2px solid #a9d3ff;
}

input, select{
    width:200px;
    padding:6px;
    margin:6px;
    border:1px solid #99c9ff;
    border-radius:5px;
}

button{
    padding:6px 12px;
    margin:4px;
    background:#a9d3ff;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.tarea{
    background:#e5f2ff;
    margin-top:8px;
    padding:6px;
    border-radius:5px;
    border:1px solid #bcdfff;
}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->
<div class="caja" id="login">
    <h2>Iniciar Sesión</h2>

    <input type="email" id="email" placeholder="Correo"><br>
    <input type="password" id="password" placeholder="Contraseña"><br>

    <button onclick="login()">Entrar</button>
    <button onclick="registro()">Registrarme</button>

    <p id="mensaje"></p>
</div>

<!-- ================= CRUD ================= -->
<div class="caja" id="crud" style="display:none;">
    <h2>CRUD de Tareas</h2>

    <input type="text" id="titulo" placeholder="Escribe una tarea"><br>

    <select id="estado">
        <option value="Pendiente">Pendiente</option>
        <option value="Completada">Completada</option>
    </select><br>

    <button onclick="crearTarea()">Agregar</button>

    <div id="lista"></div>
</div>

<script>
// ================= LOGIN =================
function login() {
    fetch('/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.mensaje){
            login.style.display = 'none';
            crud.style.display = 'block';
            cargarTareas();
        }else{
            mensaje.innerText = data.error;
        }
    });
}

function registro() {
    fetch('/registro', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
            email: email.value,
            password: password.value
        })
    })
    .then(res => res.json())
    .then(data => mensaje.innerText = data.mensaje || data.error);
}

// ================= CRUD =================
function cargarTareas(){
    fetch('/tareas')
    .then(res => res.json())
    .then(tareas => {
        lista.innerHTML = '';
        tareas.forEach(t => {
            lista.innerHTML += `
            <div class="tarea">
                ${t.titulo} - ${t.estado}
                <button onclick="eliminar(${t.id})">Eliminar</button>
            </div>`;
        });
    });
}

function crearTarea(){
    fetch('/tareas', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
            titulo: titulo.value,
            estado: estado.value
        })
    }).then(() => {
        titulo.value = '';
        cargarTareas();
    });
}

function eliminar(id){
    fetch('/tareas/'+id, {method:'DELETE'})
    .then(() => cargarTareas());
}
</script>

</body>
</html>
